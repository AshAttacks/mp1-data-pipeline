processing:
  remove_duplicates: true

  missing:
    enabled: true
    axis: "rows"

  outliers:
    enabled: true
    columns:
      - Score
    method: "iqr"
    threshold: 1.5

validation:
  required_columns: ['Student_ID','Score']
  numeric_columns: ['Student_ID','Score']

